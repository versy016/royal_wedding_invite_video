<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#342c27"><title>Sanchi & Mridul | Wedding Invitation</title><style>
@import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=DM+Sans:wght@400;500&display=swap');
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#24231e}body{display:grid;place-items:center;font-family:'Cormorant Garamond',Georgia,serif;color:#5a4930}.invite{position:relative;width:min(100vw,66.6667dvh);height:100dvh;max-height:100dvh;overflow:hidden;background:#f7e8cd;isolation:isolate}.film,.poster{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}.poster{z-index:1}.film{z-index:2;opacity:0;transition:opacity .15s}.invite.playing .film,.invite.finished .film{opacity:1}.veil{position:absolute;inset:0;z-index:3;pointer-events:none;background:linear-gradient(to bottom,rgba(255,247,223,.12),transparent 27%,transparent 75%,rgba(255,242,217,.18))}.welcome{position:absolute;z-index:5;inset:0;display:grid;place-items:center;background:linear-gradient(180deg,rgba(18,25,19,.10),rgba(18,25,19,.20));transition:opacity .65s}.welcome.hide{opacity:0;pointer-events:none}.start{background:rgba(37,43,30,.76);border:1px solid rgba(255,236,186,.85);border-radius:50px;color:#fff2d4;padding:15px 25px;letter-spacing:.14em;font:500 12px 'DM Sans',sans-serif;cursor:pointer;box-shadow:0 10px 32px #151c1660}.details{position:absolute;z-index:4;left:13%;right:13%;top:22%;bottom:20%;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:clamp(5px,1.4dvh,14px);opacity:0;pointer-events:none;transition:opacity .6s ease;text-shadow:0 1px 10px #fff3d8,0 0 15px #fff3d8}.finished .details{opacity:1;pointer-events:auto}.details>*{opacity:0;transform:translateY(12px);transition:opacity 1.6s ease,transform 1.6s ease}.finished .details>*{opacity:1;transform:none}.finished .details>:nth-child(1){transition-delay:.3s}.finished .details>:nth-child(2){transition-delay:1s}.finished .details>:nth-child(3){transition-delay:1.8s}.finished .details>:nth-child(4){transition-delay:2.8s}.finished .details>:nth-child(5){transition-delay:3.3s}.finished .details>:nth-child(6){transition-delay:4.2s}.finished .details>:nth-child(7){transition-delay:4.7s}.scratch{position:relative;display:flex;flex-direction:column;align-items:center;gap:inherit;padding:clamp(6px,1.2dvh,12px) clamp(14px,4vw,26px)}.foil{position:absolute;inset:0;width:100%;height:100%;border-radius:14px;touch-action:none;cursor:grab;box-shadow:0 4px 18px #8a6a2a55;animation:glint 2.4s ease-in-out infinite;transition:opacity .9s ease}.foil.done{opacity:0;pointer-events:none}@keyframes glint{50%{box-shadow:0 4px 26px #d9b75fa8}}.eyebrow{font:500 clamp(8px,1.25dvh,11px) 'DM Sans',sans-serif;letter-spacing:.24em;text-transform:uppercase;color:#6c5b43}.blessing{font-size:clamp(13px,2.1dvh,20px);font-style:italic;line-height:1.1}.names{font-size:clamp(36px,7.4dvh,70px);line-height:.78;font-weight:500;color:#655034}.amp{display:block;font-style:italic;font-size:.55em;line-height:1.1;color:#927955}.rule{width:55px;height:1px;background:#a48b62;margin:clamp(3px,.8dvh,9px) 0}.date{font-size:clamp(17px,2.7dvh,27px);line-height:1.1}.venue{font-size:clamp(15px,2.3dvh,23px);line-height:1.15}.family{font-size:clamp(11px,1.65dvh,16px);line-height:1.2}.actions{position:absolute;z-index:6;bottom:4%;left:0;right:0;display:flex;justify-content:center;gap:12px;opacity:0;pointer-events:none;transition:opacity .8s}.finished .actions{opacity:1;pointer-events:auto;transition-delay:5.2s}.actions button{background:#2f3929e8;color:#fff0d5;border:1px solid #d6c39b;border-radius:22px;padding:10px 17px;font:500 11px 'DM Sans',sans-serif;cursor:pointer}.mute{position:absolute;z-index:6;right:12px;top:12px;background:#2228;color:#fff;border:1px solid #fffa;border-radius:30px;padding:8px 10px;cursor:pointer;font-size:14px;display:none}.playing .mute{display:block}@media(max-height:650px){.details{top:18%;bottom:15%;gap:4px}.names{font-size:clamp(30px,7dvh,50px)}}
</style></head><body><main class="invite" id="invite"><img class="poster" src="poster.jpg" alt="Ornate garden doors with floral arrangements"><video class="film" id="film" playsinline preload="auto" poster="poster.jpg"><source src="opening.mp4" type="video/mp4"></video><div class="veil"></div><div class="welcome" id="welcome"><button class="start" id="start">✧ &nbsp; TAP TO OPEN &nbsp; ✧</button></div><button class="mute" id="mute" aria-label="Toggle sound">♪</button><section class="details" aria-label="Wedding invitation"><div class="eyebrow">With love and blessings</div><div class="blessing">The Verma Family invites you to celebrate</div><div class="names">Sanchi<span class="amp">&amp;</span>Mridul</div><div class="rule"></div><div class="scratch" id="scratch"><div class="date">21 November 2026</div><div class="eyebrow">Saturday · 7 PM onwards</div><div class="venue">Jashn – The Forest Resort<br>Amritsar</div><canvas class="foil" id="foil" aria-label="Scratch to reveal the date and venue"></canvas></div><div class="rule"></div><div class="family">With the blessings of<br>Smt Asha Verma &amp; Late Amrit Lal Verma<br>and<br>Mr Dheeraj Verma &amp; Mrs Mamta Verma</div></section><div class="actions"><button id="replay">↻ Replay animation</button></div></main><script>
const stage=document.getElementById('invite'),video=document.getElementById('film'),welcome=document.getElementById('welcome'),start=document.getElementById('start'),replay=document.getElementById('replay'),mute=document.getElementById('mute'),scratch=document.getElementById('scratch'),foil=document.getElementById('foil'),ctx=foil.getContext('2d',{willReadFrequently:true});
const SPEED=0.6;
let scratching=false,revealed=false,last=null;
function paintFoil(){const r=scratch.getBoundingClientRect(),d=devicePixelRatio||1,w=r.width,h=r.height;foil.width=w*d;foil.height=h*d;ctx.setTransform(d,0,0,d,0,0);ctx.globalCompositeOperation='source-over';const g=ctx.createLinearGradient(0,0,w,h);g.addColorStop(0,'#b38a3c');g.addColorStop(.3,'#f2dc9b');g.addColorStop(.55,'#c39a48');g.addColorStop(.8,'#f6e3a8');g.addColorStop(1,'#a97f32');ctx.fillStyle=g;ctx.fillRect(0,0,w,h);for(let i=0;i<70;i++){ctx.fillStyle=`rgba(255,250,225,${Math.random()*.7})`;ctx.beginPath();ctx.arc(Math.random()*w,Math.random()*h,Math.random()*1.6,0,7);ctx.fill()}ctx.strokeStyle='#fff3c988';ctx.lineWidth=1;ctx.strokeRect(6,6,w-12,h-12);ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillStyle='#5b431c';ctx.font=`italic 600 ${Math.max(18,h*.16)}px 'Cormorant Garamond',serif`;ctx.fillText('✦ Scratch to reveal ✦',w/2,h/2-h*.09);ctx.font=`500 ${Math.max(9,h*.07)}px 'DM Sans',sans-serif`;ctx.fillText('THE DATE  ·  TIME  ·  VENUE',w/2,h/2+h*.13);foil.classList.remove('done');revealed=false}
function pos(e){const r=foil.getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top}}
function scrape(p){ctx.globalCompositeOperation='destination-out';ctx.lineCap=ctx.lineJoin='round';ctx.lineWidth=Math.max(30,foil.clientHeight*.22);ctx.beginPath();ctx.moveTo((last||p).x,(last||p).y);ctx.lineTo(p.x,p.y);ctx.stroke();last=p}
function checkReveal(){const a=ctx.getImageData(0,0,foil.width,foil.height).data;let clear=0,n=0;for(let i=3;i<a.length;i+=64){n++;if(a[i]<40)clear++}if(clear/n>.45){revealed=true;foil.classList.add('done')}}
foil.addEventListener('pointerdown',e=>{if(revealed)return;scratching=true;last=null;try{foil.setPointerCapture(e.pointerId)}catch(_){}scrape(pos(e))});foil.addEventListener('pointermove',e=>{if(scratching)scrape(pos(e))});['pointerup','pointercancel'].forEach(t=>foil.addEventListener(t,()=>{if(!scratching)return;scratching=false;last=null;checkReveal()}));
addEventListener('resize',()=>{if(!revealed)paintFoil()});document.fonts.ready.then(paintFoil);
async function play(){stage.classList.remove('finished');stage.classList.add('playing');welcome.classList.add('hide');video.pause();video.currentTime=0;video.defaultPlaybackRate=video.playbackRate=SPEED;paintFoil();video.muted=false;mute.textContent='♪';try{await video.play()}catch(e){video.muted=true;mute.textContent='♪̸';try{await video.play()}catch(err){stage.classList.remove('playing');welcome.classList.remove('hide');start.textContent='Tap to play video'}}}
video.addEventListener('ended',()=>{stage.classList.remove('playing');stage.classList.add('finished')});video.addEventListener('error',()=>{stage.classList.remove('playing');welcome.classList.remove('hide');start.textContent='Video unavailable — retry'});start.addEventListener('click',play);replay.addEventListener('click',play);mute.addEventListener('click',()=>{video.muted=!video.muted;mute.textContent=video.muted?'♪̸':'♪'});
</script></body></html>
